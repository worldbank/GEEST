name: Create a release
on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    container:
      image: qgis/qgis:release-3_34
    steps:
      - name: Setup git config
        run: |
          git config --global --add safe.directory /__w/GeoE3/GeoE3
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Python command
        run: apt-get install python-is-python3

      - name: Install python
        uses: actions/setup-python@v5

      - name: Install plugin dependencies
        run: pip install -r requirements-dev.txt

      - name: Get experimental info
        id: get-experimental
        run: |
           echo "IS_EXPERIMENTAL=$(python -c "import json; f = open('config.json'); data=json.load(f); print(str(data['general']['experimental']).lower())")" >> "$GITHUB_OUTPUT"

      - name: Create or reuse release from tag
        id: create-release
        uses: actions/github-script@v7
        env:
          IS_EXPERIMENTAL: ${{ steps.get-experimental.outputs.IS_EXPERIMENTAL }}
        with:
          script: |
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `Release ${tag}`,
                prerelease: process.env.IS_EXPERIMENTAL === 'true',
                draft: false,
              })).data;
            }
            core.setOutput('upload_url', release.upload_url);

      - name: Generate zip
        run: python admin.py generate-zip

      - name: get zip details
        id: get-zip-details
        run: |
          echo "ZIP_PATH=dist/$(ls dist)" >> "$GITHUB_OUTPUT"
          echo "ZIP_NAME=$(ls dist)" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url}}
          asset_path: ${{ steps.get-zip-details.outputs.ZIP_PATH}}
          asset_name: ${{ steps.get-zip-details.outputs.ZIP_NAME}}
          asset_content_type: application/zip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Update custom plugin repository to include latest release
        run: |
          python admin.py --verbose generate-plugin-repo-xml
          echo " " >> docs/repository/plugins.xml

          git add -A
          git commit -m "Update on plugins.xml"
          git push origin release
