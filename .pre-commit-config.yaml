# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
repos:
  # Tool binaries below are provisioned by the nix flake (devShells.default)
  # — pre-commit must never fetch its own copies from PyPI/GitHub.
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: "🧹 end-of-file-fixer"
        entry: end-of-file-fixer
        language: system
        types: [text]
        exclude: ^(geoe3/tests/data/)
      - id: trailing-whitespace
        name: "🧽 trailing-whitespace"
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        exclude: ^(geoe3/tests/data/)
      - id: check-yaml
        name: "✅ check-yaml"
        entry: check-yaml
        language: system
        types: [yaml]
      - id: check-json
        name: "🧾 check-json"
        entry: check-json
        language: system
        types: [json]
        exclude: ^(.vscode)
  - repo: local
    hooks:
      - id: black
        name: "🖤 black"
        entry: black
        language: system
        types: [python]
  - repo: local
    hooks:
      - id: remove-core-file
        name: "🗑️ Remove core file if it exists"
        entry: bash -c '[[ -f core && ! -d core ]] && rm core || exit 0'
        language: system
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: ensure-utf8-encoding
        name: "🌐 Ensure UTF-8 encoding declaration in Python files"
        entry: bash scripts/encoding_check.sh
        language: system
        types: [python]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: ensure-google-docstrings
        name: "📚 Ensure Google-style docstrings in Python modules"
        entry: bash scripts/docstrings_check.sh
        language: system
        types: [python]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: flake8
        name: "🐍 flake8 Python Linter"
        entry: flake8
        language: system
        types: [python]
  - repo: local
    hooks:
      - id: isort
        name: "📦 isort - sort Python imports"
        entry: isort
        language: system
        types: [python]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: nixfmt
        name: "❄️ Nixfmt (RFC style)"
        description: Format Nix code with nixfmt-rfc-style
        entry: nixfmt
        language: system
        args: ["--"]
        types: [nix]
  #- repo: local
  #  hooks:
  #    - id: markdownlint
  #      name: "📝 markdownlint - Markdown linter"
  #      entry: markdownlint
  #      language: system
  #      types: [markdown]
  #      stages: [pre-commit]
  - repo: local
    hooks:
      - id: cspell
        name: "🔤 cspell - Spell checker for Markdown"
        entry: cspell --config=.cspell.json --no-progress --no-summary --no-must-find-files
        language: system
        types: [markdown]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: yamllint
        name: "🔍 yamllint - YAML linter"
        entry: yamllint
        language: system
        types: [yaml]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: actionlint
        name: "🤖 actionlint - GitHub Actions workflow linter"
        entry: actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: bandit-scripts
        name: "🔒 Bandit - Python security analysis"
        entry: bandit -c .bandit.yml -r scripts
        language: system
        types: [python]
        stages: [pre-commit]
        exclude: ^scripts/tests/
  - repo: local
    hooks:
      - id: shellcheck-scripts
        name: "🐚 ShellCheck - scripts"
        entry: shellcheck
        language: system
        files: ^scripts/.*\.(sh|bash|zsh)$
        pass_filenames: true
